name: Terminal Full Page PTY Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Full page samples or bounded transport preflight'
        type: choice
        options: [pipeline, transport]
        default: pipeline
      evidence_run_id:
        description: 'Read bounded original pipeline failure excerpts; skips building'
        type: string
        default: ''
      evidence_sha:
        description: 'Exact source SHA of evidence_run_id'
        type: string
        default: ''
  push:
    branches: [opt/terminal-verified-a79e7b6]
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/data/container/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/Terminal*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/ProcessSessionPage.kt'
      - 'app/src/terminaltest/**'
      - 'app/src/terminaltestAndroidTest/**'
      - 'app/build.gradle.kts'
      - '.github/scripts/run-terminal-pipeline.py'
      - '.github/scripts/test_terminal_pipeline.py'
      - '.github/workflows/terminal-pipeline-tests.yml'
      - 'benchmarks/production_emulator.py'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    if: ${{ inputs.evidence_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.evidence_run_id }}
      SOURCE_SHA: ${{ inputs.evidence_sha }}
    steps:
      - name: Bind requested diagnostic to an existing pipeline run
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id, sha = os.environ['SOURCE_RUN'], os.environ['SOURCE_SHA']
          assert re.fullmatch('[0-9]+', run_id) and re.fullmatch('[a-f0-9]{40}', sha)
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['head_sha'] == sha and run['status'] == 'completed'
          assert run['path'] == '.github/workflows/terminal-pipeline-tests.yml'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'artifact=terminal-pipeline-{sha}-{run["run_attempt"]}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}
          name: ${{ steps.source.outputs.artifact }}
          path: original-pipeline
      - name: Export only first exception contexts and lifecycle diagnostics
        run: |
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          import os
          def note(title, lines):
              value = ('source=' + os.environ['SOURCE_SHA'] + ' run=' + os.environ['SOURCE_RUN'] + '\n' + '\n'.join(lines))[:2800]
              print('::notice title=' + title + '::' + value.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          for name in ('instrumentation.log', 'pipeline-logcat.txt'):
              files = list(Path('original-pipeline').rglob(name))
              assert len(files) == 1, name
              lines, remaining, blocks, previous = [], 0, 0, deque(maxlen=2)
              with files[0].open(errors='replace') as stream:
                  for raw in stream:
                      line = raw.rstrip()[:700]
                      if ('java.lang.' in line or 'Error in ' in line or 'FATAL EXCEPTION' in line or 'No compose hierarchies' in line) and remaining == 0 and blocks < 3:
                          lines.extend(previous)
                          remaining, blocks = 5, blocks + 1
                      if remaining:
                          lines.append(line)
                          remaining -= 1
                      previous.append(line)
              note('Original pipeline ' + name, lines)
          # Fatal exceptions can occur after earlier expected test failures; never let the first
          # three java.lang stack frames exhaust the diagnostic budget before the actual crash.
          logcat = next(Path('original-pipeline').rglob('pipeline-logcat.txt'))
          fatal, remaining = [], 0
          with logcat.open(errors='replace') as stream:
              for raw in stream:
                  line = raw.rstrip()
                  if 'FATAL EXCEPTION' in line:
                      fatal, remaining = [], 32
                  if remaining:
                      fatal.append(line)
                      remaining -= 1
          if fatal:
              note('Original pipeline fatal first', fatal[:14])
              note('Original pipeline fatal continuation', fatal[14:])
          instrument = next(Path('original-pipeline').rglob('instrumentation.log'))
          with instrument.open(errors='replace') as stream:
              callers = [line.rstrip() for line in stream if 'TerminalPipelineInstrumentedTest.exercise(' in line]
          note('Original pipeline failure callers', callers)
          PY
  pipeline:
    if: ${{ inputs.evidence_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TERMINAL_PIPELINE_SUITE: ${{ inputs.suite || 'pipeline' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate diagnostics and build Release-derived full-page test pair
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          chmod +x gradlew
          bash .github/scripts/run-terminal-gradle.sh -PterminalPipelineTests=true -PincludeX86_64AbiForTests=true \
            :app:assembleTerminaltest :app:assembleTerminaltestAndroidTest --stacktrace
          python3 .github/scripts/run-terminal-pipeline.py prepare
      - name: Run actual page and native PTY with real keyboard on non-root KVM guest
        run: python3 .github/scripts/run-terminal-pipeline.py emulator
      - name: Preserve exact source identities, samples and focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-pipeline-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-pipeline/
            artifacts/terminal-validation/
          if-no-files-found: error
          retention-days: 14
