name: Terminal Full Page PTY Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Full page samples, transport preflight, or same-device AB/BA experiment'
        type: choice
        options: [pipeline, transport, all, tuiBundle, tuiOnly, bottomVisibility, bottomOnly, tuiHistory, tuiHistoryOnly, tuiHistoryCompletion, fullVirtual, fullVirtualOnly, fullVirtualLatency, tracePreflight, paired, bundlePaired, service, byteBuffer, soak, mountDiagnostic]
        default: pipeline
      evidence_run_id:
        description: 'Read bounded original pipeline failure excerpts; skips building'
        type: string
        default: ''
      soak_mode:
        type: choice
        options: [chunkedLayers, lazyHistory, lazyHistoryIme]
        default: chunkedLayers
      soak_seconds:
        type: string
        default: '1800'
      checks_only:
        description: 'Compile the Release-derived real-page/test pair without running a guest or test'
        type: boolean
        default: false
      evidence_sha:
        description: 'Exact source SHA of evidence_run_id'
        type: string
        default: ''
  push:
    branches: [opt/terminal-verified-a79e7b6]
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/data/container/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/Terminal*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/ProcessSessionPage.kt'
      - 'app/src/terminaltest/**'
      - 'app/src/terminaltestAndroidTest/**'
      - 'app/build.gradle.kts'
      - '.github/scripts/run-terminal-pipeline.py'
      - '.github/scripts/run-terminal-pipeline-paired.py'
      - '.github/scripts/test_terminal_pipeline_paired.py'
      - '.github/workflows/terminal-pipeline-paired.yml'
      - 'benchmarks/terminal-pipeline-paired/**'
      - '.github/scripts/test_terminal_pipeline.py'
      - '.github/scripts/terminal-byte-buffer-reports.py'
      - '.github/scripts/test_terminal_byte_buffer.py'
      - '.github/scripts/build-terminal-proot.py'
      - '.github/scripts/test_terminal_proot.py'
      - 'benchmarks/proot-x86_64/**'
      - '.github/workflows/terminal-pipeline-tests.yml'
      - 'benchmarks/production_emulator.py'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read
  actions: read

jobs:
  trace-preflight:
    if: ${{ inputs.evidence_run_id == '' && inputs.suite == 'tracePreflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate trace-only contracts without build or APK
        run: python3 -B -m unittest discover -s .github/scripts -p test_terminal_trace_preflight.py
      - name: Diagnose three fixed short trace transports on disposable non-root KVM guest
        run: python3 -B .github/scripts/terminal-trace-preflight.py
      - name: Preserve original native diagnostics, raw traces and exact identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-trace-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/terminal-trace-preflight/
          if-no-files-found: error
          retention-days: 14
  paired:
    if: ${{ inputs.evidence_run_id == '' && inputs.suite == 'paired' }}
    uses: ./.github/workflows/terminal-pipeline-paired.yml
  bundle-paired:
    if: ${{ inputs.evidence_run_id == '' && inputs.suite == 'bundlePaired' }}
    uses: ./.github/workflows/terminal-bundle-paired.yml
  evidence:
    if: ${{ inputs.evidence_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.evidence_run_id }}
      SOURCE_SHA: ${{ inputs.evidence_sha }}
    steps:
      - name: Bind requested diagnostic to an existing pipeline run
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id, sha = os.environ['SOURCE_RUN'], os.environ['SOURCE_SHA']
          assert re.fullmatch('[0-9]+', run_id) and re.fullmatch('[a-f0-9]{40}', sha)
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['head_sha'] == sha and run['status'] == 'completed'
          assert run['path'] == '.github/workflows/terminal-pipeline-tests.yml'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'artifact=terminal-pipeline-{sha}-{run["run_attempt"]}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}
          name: ${{ steps.source.outputs.artifact }}
          path: original-pipeline
      - name: Export only first exception contexts and lifecycle diagnostics
        run: |
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          import os
          def note(title, lines):
              value = ('source=' + os.environ['SOURCE_SHA'] + ' run=' + os.environ['SOURCE_RUN'] + '\n' + '\n'.join(lines))[:2800]
              print('::notice title=' + title + '::' + value.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          def page_log(name):
              files = [path for path in Path('original-pipeline').rglob(name)
                  if 'transport-preflight' not in path.parts and 'service-preflight' not in path.parts]
              assert len(files) == 1, name
              return files[0]
          for name in ('instrumentation.log', 'pipeline-logcat.txt'):
              lines, remaining, blocks, previous = [], 0, 0, deque(maxlen=2)
              with page_log(name).open(errors='replace') as stream:
                  for raw in stream:
                      line = raw.rstrip()[:700]
                      if ('java.lang.' in line or 'Error in ' in line or 'FATAL EXCEPTION' in line or 'No compose hierarchies' in line) and remaining == 0 and blocks < 3:
                          lines.extend(previous)
                          remaining, blocks = 5, blocks + 1
                      if remaining:
                          lines.append(line)
                          remaining -= 1
                      previous.append(line)
              note('Original pipeline ' + name, lines)
          # Fatal exceptions can occur after earlier expected test failures; never let the first
          # three java.lang stack frames exhaust the diagnostic budget before the actual crash.
          logcat = page_log('pipeline-logcat.txt')
          fatal, remaining = [], 0
          with logcat.open(errors='replace') as stream:
              for raw in stream:
                  line = raw.rstrip()
                  if 'FATAL EXCEPTION' in line:
                      fatal, remaining = [], 32
                  if remaining:
                      fatal.append(line)
                      remaining -= 1
          if fatal:
              note('Original pipeline fatal first', fatal[:14])
              note('Original pipeline fatal continuation', fatal[14:])
          instrument = page_log('instrumentation.log')
          with instrument.open(errors='replace') as stream:
              callers = [line.rstrip() for line in stream if 'TerminalPipelineInstrumentedTest.exercise(' in line]
          note('Original pipeline failure callers', callers)
          PY
  pipeline:
    if: ${{ inputs.evidence_run_id == '' && inputs.suite != 'paired' && inputs.suite != 'bundlePaired' && inputs.suite != 'tracePreflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      TERMINAL_PIPELINE_SUITE: ${{ inputs.suite || 'pipeline' }}
      TERMINAL_SOAK_MODE: ${{ inputs.soak_mode || 'chunkedLayers' }}
      TERMINAL_SOAK_SECONDS: ${{ inputs.soak_seconds || '1800' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build pinned x86_64 fork-compatibility asset for test variant only
        # Runtime compilation remains CI-only; no production runtime assets change.
        run: python3 .github/scripts/build-terminal-proot.py
      - name: Bind explicitly added page-only convergence round to unchanged candidate production
        if: ${{ inputs.suite == 'tuiHistoryCompletion' }}
        run: python3 -B .github/scripts/terminal-tui-history-page-convergence.py
      - name: Validate diagnostics and build Release-derived full-page test pair
        run: |
          if [ "$TERMINAL_PIPELINE_SUITE" = fullVirtualLatency ]; then
            python3 -B .github/scripts/terminal-full-virtual-latency.py guard
          fi
          chmod +x gradlew
          bash .github/scripts/run-terminal-gradle.sh -PterminalPipelineTests=true -PincludeX86_64AbiForTests=true \
            :app:assembleTerminaltest :app:assembleTerminaltestAndroidTest --stacktrace
          python3 .github/scripts/run-terminal-pipeline.py prepare
      - name: Validate only relevant real-page and bundle report contracts after type compilation
        if: ${{ !inputs.checks_only }}
        run: |
          cd .github/scripts
          python3 -B -m unittest test_terminal_pipeline test_terminal_pipeline_paired test_terminal_bundle_reports test_terminal_bundle_paired test_terminal_byte_buffer test_terminal_tui_bundle test_terminal_bottom_visibility test_terminal_tui_history test_terminal_tui_page_convergence test_terminal_full_virtual test_terminal_full_virtual_latency
      - name: Run actual page and native PTY with real keyboard on non-root KVM guest
        if: ${{ !inputs.checks_only }}
        run: python3 .github/scripts/run-terminal-pipeline.py emulator
      - name: Publish bounded original v2 page evidence part one
        if: ${{ success() && !inputs.checks_only && inputs.suite == 'tuiHistoryCompletion' }}
        run: python3 -B .github/scripts/terminal-tui-history-page-convergence.py evidence --page 1
      - name: Publish bounded original v2 page evidence part two
        if: ${{ success() && !inputs.checks_only && inputs.suite == 'tuiHistoryCompletion' }}
        run: python3 -B .github/scripts/terminal-tui-history-page-convergence.py evidence --page 2
      - name: Preserve exact source identities, samples and focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-pipeline-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-pipeline/
            artifacts/terminal-validation/
            artifacts/pipeline-proot-build/build.log
          if-no-files-found: error
          retention-days: 14
      - name: Publish bounded full-virtual latency baseline summary part one
        if: ${{ always() && hashFiles('artifacts/terminal-pipeline/full-virtual-latency-summary.json') != '' }}
        run: python3 -B .github/scripts/terminal-full-virtual-latency.py evidence --page 1
      - name: Publish bounded full-virtual latency baseline summary part two
        if: ${{ always() && hashFiles('artifacts/terminal-pipeline/full-virtual-latency-summary.json') != '' }}
        run: python3 -B .github/scripts/terminal-full-virtual-latency.py evidence --page 2
      - name: Publish bounded original full virtual page evidence part one
        if: ${{ always() && hashFiles('artifacts/terminal-pipeline/full-virtual-page.json') != '' }}
        run: python3 -B .github/scripts/terminal-full-virtual-reports.py evidence --report full-virtual-page --page 1
      - name: Publish bounded original full virtual page evidence part two
        if: ${{ always() && hashFiles('artifacts/terminal-pipeline/full-virtual-page.json') != '' }}
        run: python3 -B .github/scripts/terminal-full-virtual-reports.py evidence --report full-virtual-page --page 2
