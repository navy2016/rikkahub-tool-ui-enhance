name: Relay Artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source workflow run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Download and republish artifact
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const runId = '${{ inputs.run_id }}';
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: parseInt(runId),
            });
            const artifact = artifacts.data.artifacts.find(item => !item.expired);
            if (!artifact) throw new Error(`No live artifact found for run ${runId}`);
            core.info(`Found ${artifact.name} (${artifact.size_in_bytes} bytes, id=${artifact.id})`);
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            const response = await fetch(download.url);
            if (!response.ok) throw new Error(`Download failed: ${response.status}`);
            fs.writeFileSync('/tmp/artifact.zip', Buffer.from(await response.arrayBuffer()));

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: artifact-cache
          files: /tmp/artifact.zip
          name: Artifact Cache
          body: Relayed artifact from run ${{ inputs.run_id }}
          prerelease: true
