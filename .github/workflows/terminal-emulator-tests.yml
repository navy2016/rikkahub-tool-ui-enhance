name: Terminal Emulator Tests

on:
  push:
    branches:
      - feature/interactive-session
      - fix/container-terminal-lifecycle
      - main
      - master
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/RouteActivity.kt'
      - 'app/src/main/java/me/rerere/rikkahub/utils/TerminalEmulator.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/**'
      - 'app/src/main/java/me/rerere/rikkahub/data/repository/ConversationRepository.kt'
      - 'app/src/main/java/me/rerere/rikkahub/di/RepositoryModule.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/components/ai/ChatInput.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingAdvancedPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/service/ContainerProcessForegroundService.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/ai/tools/LocalTools.kt'
      - 'app/src/test/java/me/rerere/rikkahub/utils/TerminalEmulatorTest.kt'
      - 'app/src/test/java/me/rerere/rikkahub/data/container/**'
      - '.github/workflows/terminal-emulator-tests.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
  pull_request:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/RouteActivity.kt'
      - 'app/src/main/java/me/rerere/rikkahub/utils/TerminalEmulator.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/**'
      - 'app/src/main/java/me/rerere/rikkahub/data/repository/ConversationRepository.kt'
      - 'app/src/main/java/me/rerere/rikkahub/di/RepositoryModule.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/components/ai/ChatInput.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingAdvancedPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/service/ContainerProcessForegroundService.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/ai/tools/LocalTools.kt'
      - 'app/src/test/java/me/rerere/rikkahub/utils/TerminalEmulatorTest.kt'
      - 'app/src/test/java/me/rerere/rikkahub/data/container/**'
      - '.github/workflows/terminal-emulator-tests.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
  workflow_dispatch:

jobs:
  unit-test:
    name: Run TerminalEmulator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOFGS'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [{"current_key": "AIzaSyDummyKey000000000000000000000000"}]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.dev.next"
                  }
                },
                "api_key": [{"current_key": "AIzaSyDummyKey000000000000000000000001"}]
              }
            ],
            "configuration_version": "1"
          }
          EOFGS

      - name: Run PTY mode inference tests
        run: ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.container.PtyModeInferenceTest --stacktrace

      - name: Run Bun and terminal UI source tests
        run: ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.container.BunCompatibilitySourceTest --tests me.rerere.rikkahub.data.container.TerminalUiSourceTest --tests me.rerere.rikkahub.data.container.ProcessSessionNavigationSourceTest --tests me.rerere.rikkahub.data.container.ConversationSandboxCleanupSourceTest --tests me.rerere.rikkahub.data.container.TerminalSmoothnessSourceTest --stacktrace

      - name: Run focused unit tests
        run: |
          for attempt in 1 2 3; do
            echo "Gradle test attempt ${attempt}/3"
            if ./gradlew :app:testDebugUnitTest \
              --tests me.rerere.rikkahub.utils.TerminalEmulatorTest \
              --tests me.rerere.rikkahub.data.container.ControlInputTest \
              --tests me.rerere.rikkahub.data.container.InteractiveTerminalSnapshotTest \
              --tests me.rerere.rikkahub.data.container.PtyModeInferenceTest \
              --tests me.rerere.rikkahub.data.container.BunCompatibilitySourceTest \
              --tests me.rerere.rikkahub.data.container.TerminalUiSourceTest \
              --tests me.rerere.rikkahub.data.container.ProcessSessionNavigationSourceTest \
              --tests me.rerere.rikkahub.data.container.ConversationSandboxCleanupSourceTest \
              --tests me.rerere.rikkahub.data.container.TerminalSmoothnessSourceTest \
              --stacktrace; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-emulator-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          retention-days: 7
