name: Build bundled oh-my-pi runtime

on:
  workflow_dispatch:
    inputs:
      omp_ref:
        description: oh-my-pi git ref to package
        required: true
        default: main
      commit_assets:
        description: Commit generated assets back to this branch
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feature/bundled-oh-my-pi
    paths:
      - '.github/workflows/build-omp-bundle.yml'
      - 'scripts/build-omp-bundle.sh'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/PRootManager.kt'
      - 'docs/oh-my-pi-bundled.md'

permissions:
  contents: write

env:
  OMP_REF: ${{ github.event.inputs.omp_ref || 'main' }}

jobs:
  build-aarch64-musl:
    name: Build Alpine aarch64/musl OMP bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout RikkaHub
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Build bun + omp base bundle in Alpine arm64
        run: |
          set -euo pipefail
          chmod +x scripts/build-omp-bundle.sh
          docker run --rm \
            -e OMP_REF="${OMP_REF}" \
            -v "$PWD:/work" \
            -w /work \
            alpine:3.19 \
            sh scripts/build-omp-bundle.sh

      # ----------------------------------------------------------------------
      # Browser support for Android PRoot Alpine sandbox:
      #
      # Puppeteer may download the wrong Chrome binary, for example x86_64 glibc
      # Chrome inside an aarch64/musl Alpine container. That fails with errors like:
      #   - /lib64/ld-linux-x86-64.so.2 missing
      #   - __vsnprintf_chk missing
      #   - g_settings_* missing
      #   - snd_pcm_* missing
      #
      # Fix:
      #   1. Keep the public artifact names unchanged.
      #   2. Unpack omp-alpine-aarch64-musl.tar.gz.
      #   3. Bundle Alpine 3.19 chromium, built for aarch64/musl, into omp/browser.
      #   4. Bundle chromium runtime .so dependencies from Alpine.
      #   5. Generate our own launcher at /usr/local/omp/browser/bin/chromium-browser.
      #   6. Rewrite omp/omp wrapper so Puppeteer uses the bundled chromium and does
      #      not download browser binaries at runtime.
      #   7. Repack the original omp tar.
      #
      # This changes only this workflow file. build-omp-bundle.sh and Kotlin code
      # remain unchanged.
      # ----------------------------------------------------------------------

      - name: Unpack omp tar and bundle Alpine musl/aarch64 chromium
        run: |
          set -euo pipefail

          OMP_TAR=app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz
          STAGE=.omp-browser-repack
          BROWSER_SCRIPT="$STAGE/bundle-browser.sh"

          test -f "$OMP_TAR" || { echo "OMP tar not found: $OMP_TAR" >&2; exit 1; }

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          tar -xzf "$OMP_TAR" -C "$STAGE"
          test -f "$STAGE/omp/omp" || { echo "omp wrapper missing after unpack" >&2; exit 1; }

          cat > "$BROWSER_SCRIPT" <<'BROWSER_SCRIPT_EOF'
          set -eu

          echo "== installing Alpine chromium deps =="
          apk add --no-cache --virtual .rikkahub-browser-deps \
            chromium \
            nss freetype harfbuzz fontconfig expat \
            dbus-libs libdrm cairo pango \
            libxcomposite libxdamage libxrandr libxkbcommon gcompat \
            alsa-lib at-spi2-core cups-libs

          DEST=/work/.omp-browser-repack/omp/browser
          echo "== preparing browser payload at $DEST =="
          rm -rf "$DEST"
          mkdir -p "$DEST/bin" "$DEST/lib" "$DEST/share/fonts" "$DEST/etc/fonts"

          echo "== copying chromium payload =="
          test -d /usr/lib/chromium || { echo "/usr/lib/chromium missing" >&2; exit 1; }
          test -x /usr/lib/chromium/chromium || { echo "/usr/lib/chromium/chromium missing or not executable" >&2; exit 1; }

          cp -a /usr/lib/chromium "$DEST/chromium"

          # Headless/browser-tool use does not require bundled GLES/Vulkan.
          # If a future Chromium build requires these, remove this pruning.
          rm -f "$DEST/chromium/libGLESv2.so" \
                "$DEST/chromium/libEGL.so" \
                "$DEST/chromium/libvulkan.so.1"

          echo "== copying chromium runtime libraries =="
          find /usr/lib/chromium -type f \( -perm -0100 -o -name "*.so" -o -name "*.so.*" \) \
            -exec ldd {} + 2>/dev/null \
            | awk '/=>/{print $3}' \
            | sort -u \
            | while read -r so; do
                case "$so" in
                  /lib/ld-musl*|/lib/libc.musl*|/lib/libz.so*|/lib/ld-linux*)
                    continue ;;
                esac
                [ -f "$so" ] || continue
                cp -L "$so" "$DEST/lib/$(basename "$so")"
              done

          echo "== copying fonts/fontconfig =="
          [ -d /usr/share/fonts ] && cp -a /usr/share/fonts/. "$DEST/share/fonts/" || true
          [ -d /etc/fonts ] && cp -a /etc/fonts/. "$DEST/etc/fonts/" || true

          echo "== generating bundled chromium launcher =="
          {
            printf '%s\n' '#!/bin/sh'
            printf '%s\n' 'set -eu'
            printf '%s\n' ''
            printf '%s\n' 'BROWSER_HOME="${BROWSER_HOME:-/usr/local/omp/browser}"'
            printf '%s\n' 'CHROMIUM_HOME="${CHROMIUM_HOME:-$BROWSER_HOME/chromium}"'
            printf '%s\n' ''
            printf '%s\n' 'export LD_LIBRARY_PATH="$BROWSER_HOME/lib:$CHROMIUM_HOME:${LD_LIBRARY_PATH:-}"'
            printf '%s\n' 'export FONTCONFIG_PATH="${FONTCONFIG_PATH:-$BROWSER_HOME/etc/fonts}"'
            printf '%s\n' 'export XDG_DATA_DIRS="${XDG_DATA_DIRS:-$BROWSER_HOME/share:/usr/local/share:/usr/share}"'
            printf '%s\n' ''
            printf '%s\n' 'exec "$CHROMIUM_HOME/chromium" \'
            printf '%s\n' '  --no-sandbox \'
            printf '%s\n' '  --disable-setuid-sandbox \'
            printf '%s\n' '  --disable-dev-shm-usage \'
            printf '%s\n' '  --disable-gpu \'
            printf '%s\n' '  --no-zygote \'
            printf '%s\n' '  "$@"'
          } > "$DEST/bin/chromium-browser"

          chmod 755 "$DEST/bin/chromium-browser"

          echo "== verifying bundled browser files =="
          test -x "$DEST/bin/chromium-browser" || { echo "launcher not executable: $DEST/bin/chromium-browser" >&2; exit 1; }
          test -x "$DEST/chromium/chromium" || { echo "chromium not executable: $DEST/chromium/chromium" >&2; exit 1; }

          echo "== bundled browser launcher =="
          ls -la "$DEST/bin"
          sed -n '1,80p' "$DEST/bin/chromium-browser"

          echo "== bundled browser payload =="
          du -sh "$DEST" "$DEST"/* 2>/dev/null || true
          echo "browser lib count: $(ls "$DEST/lib" | wc -l)"

          echo "== browser tree sample =="
          find "$DEST" -maxdepth 3 \( -type f -o -type l \) | sort | head -80

          # Smoke check inside builder.
          # Override BROWSER_HOME because here payload lives under /work/.omp-browser-repack,
          # not /usr/local/omp.
          BROWSER_HOME="$DEST" "$DEST/bin/chromium-browser" --version || true
          BROWSER_SCRIPT_EOF

          echo "== generated browser bundling script =="
          sed -n '1,220p' "$BROWSER_SCRIPT"

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine:3.19 \
            sh "/work/$BROWSER_SCRIPT"

          echo "== verifying browser payload on host after docker =="
          if [ ! -e "$STAGE/omp/browser/bin/chromium-browser" ]; then
            echo "browser launcher missing after docker step" >&2
            echo "debug: stage tree:" >&2
            find "$STAGE" -maxdepth 5 \( -type f -o -type l \) 2>/dev/null | sort | head -120 >&2 || true
            exit 1
          fi

          if [ ! -x "$STAGE/omp/browser/bin/chromium-browser" ]; then
            echo "browser launcher exists but is not executable after docker step" >&2
            ls -la "$STAGE/omp/browser/bin" >&2 || true
            exit 1
          fi

          test -x "$STAGE/omp/browser/chromium/chromium" || {
            echo "chromium binary missing or not executable after docker step" >&2
            ls -la "$STAGE/omp/browser/chromium" >&2 || true
            exit 1
          }

          echo "== host browser payload verified =="
          ls -la "$STAGE/omp/browser/bin"
          du -sh "$STAGE/omp/browser"

      - name: Rewrite omp wrapper to force bundled chromium and skip Puppeteer download
        run: |
          set -euo pipefail

          WRAPPER=.omp-browser-repack/omp/omp
          test -f "$WRAPPER" || { echo "wrapper not found: $WRAPPER" >&2; exit 1; }

          cp "$WRAPPER" "$WRAPPER.bak"

          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path(".omp-browser-repack/omp/omp")
          original = wrapper.read_text()

          marker = "# --- RikkaHub bundled browser env (added by build-omp-bundle.yml) ---"
          if marker in original:
              print("browser env already present; leaving wrapper unchanged")
              raise SystemExit(0)

          injection = r'''
          # --- RikkaHub bundled browser env (added by build-omp-bundle.yml) ---
          RHK_BROWSER_HOME="/usr/local/omp/browser"
          RHK_BROWSER_LIB="${RHK_BROWSER_HOME}/lib"
          RHK_BROWSER_CHROMIUM="${RHK_BROWSER_HOME}/chromium"
          RHK_BROWSER_BIN="${RHK_BROWSER_HOME}/bin/chromium-browser"

          case ":${LD_LIBRARY_PATH:-}:" in
            *":${RHK_BROWSER_LIB}:"*) ;;
            *) export LD_LIBRARY_PATH="${RHK_BROWSER_LIB}:${RHK_BROWSER_CHROMIUM}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ;;
          esac

          case ":${PATH:-}:" in
            *":${RHK_BROWSER_HOME}/bin:"*) ;;
            *) export PATH="${RHK_BROWSER_HOME}/bin:${PATH}" ;;
          esac

          export FONTCONFIG_PATH="${FONTCONFIG_PATH:-${RHK_BROWSER_HOME}/etc/fonts}"
          export XDG_DATA_DIRS="${XDG_DATA_DIRS:-${RHK_BROWSER_HOME}/share:/usr/local/share:/usr/share}"
          export PUPPETEER_SKIP_DOWNLOAD=true
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          export PUPPETEER_EXECUTABLE_PATH="${PUPPETEER_EXECUTABLE_PATH:-${RHK_BROWSER_BIN}}"
          export CHROME_BIN="${CHROME_BIN:-${RHK_BROWSER_BIN}}"
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1

          # Clean stale wrong-arch browser caches from previous app versions.
          _rhk_home="${HOME:-/root}"
          for _rhk_p in \
            "${_rhk_home}/.cache/puppeteer/chrome" \
            "${_rhk_home}/.cache/puppeteer/chrome-headless-shell" \
            "${_rhk_home}/.omp/puppeteer/chrome" \
            "${_rhk_home}/.omp/puppeteer/chrome-headless-shell"
          do
            [ -d "${_rhk_p}" ] && rm -rf "${_rhk_p}" 2>/dev/null || true
          done
          unset _rhk_home _rhk_p
          # --- end RikkaHub bundled browser env ---
          '''

          needle = "set -eu\n"
          if needle not in original:
              raise SystemExit("set -eu not found in omp wrapper")

          updated = original.replace(needle, needle + injection.lstrip() + "\n", 1)
          wrapper.write_text(updated)
          PY

          chmod +x "$WRAPPER"

          echo "== updated omp wrapper head =="
          sed -n '1,120p' "$WRAPPER"

      - name: Repack omp tar with bundled browser
        run: |
          set -euo pipefail

          STAGE=.omp-browser-repack
          OMP_TAR=app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz

          test -f "$STAGE/omp/omp" || { echo "missing omp wrapper" >&2; exit 1; }

          if [ ! -e "$STAGE/omp/browser/bin/chromium-browser" ]; then
            echo "missing bundled chromium launcher file" >&2
            echo "debug: browser tree:" >&2
            find "$STAGE/omp/browser" -maxdepth 3 \( -type f -o -type l \) 2>/dev/null | sort | head -80 >&2 || true
            exit 1
          fi

          if [ ! -x "$STAGE/omp/browser/bin/chromium-browser" ]; then
            echo "bundled chromium launcher exists but is not executable" >&2
            ls -la "$STAGE/omp/browser/bin" >&2 || true
            exit 1
          fi

          test -x "$STAGE/omp/browser/chromium/chromium" || { echo "missing chromium binary" >&2; exit 1; }
          grep -q "RHK_BROWSER_BIN" "$STAGE/omp/omp" || { echo "wrapper missing browser env" >&2; exit 1; }

          tar -czf "$OMP_TAR" -C "$STAGE" omp

          echo "== final bundles =="
          ls -lh app/src/main/assets/bun/*.tar.gz app/src/main/assets/omp/*.tar.gz
          du -sh "$STAGE/omp" "$STAGE/omp/browser"

      - name: Show bundle sizes
        run: |
          ls -lh app/src/main/assets/bun/*.tar.gz app/src/main/assets/omp/*.tar.gz
          du -h app/src/main/assets/bun/*.tar.gz app/src/main/assets/omp/*.tar.gz

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundled-oh-my-pi-alpine-aarch64-musl
          path: |
            app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz
            app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz
          retention-days: 14

      - name: Commit assets to branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_assets }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git lfs install
          git lfs track 'app/src/main/assets/bun/*.tar.gz'
          git lfs track 'app/src/main/assets/omp/*.tar.gz'
          git add .gitattributes app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz
          git commit -m "Bundle oh-my-pi Alpine aarch64 runtime with musl chromium" || exit 0
          git lfs status
          git push origin HEAD:${GITHUB_REF_NAME}
