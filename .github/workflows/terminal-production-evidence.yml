name: Terminal Production Evidence

on:
  workflow_call:
    inputs:
      run_id:
        description: Completed production benchmark workflow run
        required: true
        type: string
      source_sha:
        description: Exact source SHA from that run
        required: true
        type: string
      scenario:
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == 'all' && '["initialCompose","activeRowUpdate","appendAndTrim","semanticJump","imeRoundTrip","detachRestore"]' || format('["{0}"]', inputs.scenario)) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - name: Bind evidence request to the original workflow and source
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id, sha = os.environ['SOURCE_RUN'], os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9]+', run_id)
          assert re.fullmatch(r'[a-f0-9]{40}', sha)
          assert os.environ['SCENARIO'] in ('initialCompose', 'activeRowUpdate', 'appendAndTrim',
              'semanticJump', 'imeRoundTrip', 'detachRestore')
          run = json.loads(subprocess.check_output(['gh', 'api',
              f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['head_sha'] == sha and run['status'] == 'completed'
          assert run['path'] == '.github/workflows/terminal-production-benchmark.yml'
          scenario = os.environ['SCENARIO']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'pattern=production-viewport-{scenario}-{sha}-*\n')
          PY
      - name: Read only the selected scenario artifacts on the runner
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: ${{ steps.source.outputs.pattern }}
          path: artifacts/source-evidence
      - name: Export bounded diagnostics and original provenance
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, zlib
          root = pathlib.Path('artifacts/source-evidence')
          output = pathlib.Path('artifacts/compact-evidence')
          output.mkdir(parents=True)
          def notice(title, text):
              assert len(text.encode()) <= 3800  # GitHub truncates each annotation at 4096 bytes.
              print('::notice title=' + title + '::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          groups = list(root.rglob('request.json'))
          assert groups, 'No requested scenario evidence'
          for request_path in sorted(groups):
              folder = request_path.parent
              request = json.loads(request_path.read_text())
              manifest = json.loads((folder / 'manifest.json').read_text())
              assert request['sourceSha'] == manifest['sourceSha'] == os.environ['SOURCE_SHA']
              assert request['runId'] == manifest['buildRun'] == os.environ['SOURCE_RUN']
              contexts = []
              result_files = {}
              for path in folder.rglob('*-benchmarkData.json'):
                  doc = json.loads(path.read_text())
                  result_files[str(path.relative_to(folder))] = hashlib.sha256(path.read_bytes()).hexdigest()
                  if doc.get('context') not in contexts:
                      contexts.append(doc.get('context'))
              validated = folder / 'validated.json'
              summary = folder / 'summary.md'
              # Retain launch-bound work diagnostics even on success; no transcript or APK bytes.
              with (folder / 'logcat.txt').open(errors='replace') as stream:
                  work_samples = [line.strip() for line in stream if ' IME_WORK ' in line]
              evidence = dict(request=request, manifest=manifest, device=(folder / 'device.txt').read_text(),
                  contexts=contexts, validated=json.loads(validated.read_text()) if validated.exists() else None,
                  result_files=result_files, summary=summary.read_text() if summary.exists() else None,
                  work_samples=work_samples)
              group = request['groupId']
              (output / (group + '.json')).write_text(json.dumps(evidence, indent=2) + '\n')
              data = json.dumps(evidence, separators=(',', ':')).encode()
              digest = hashlib.sha256(data).hexdigest()
              encoded = base64.b64encode(zlib.compress(data, 9)).decode()
              parts = [encoded[i:i + 3200] for i in range(0, len(encoded), 3200)]
              assert len(parts) <= 6, 'Unexpectedly large provenance'
              for index, part in enumerate(parts):
                  notice(f'Production provenance {group} part {index + 1}/{len(parts)}',
                      f'zlib-base64 sha256={digest}\n{part}')
              logcat = (folder / 'logcat.txt').read_text(errors='replace').splitlines()
              # Success provenance is compact; failures also retain target completion timestamps
              # and focused exceptions. Do not fill the step's ten-annotation budget with ART logs.
              if not validated.exists():
                  lines = [line[:350] for line in logcat if 'I ProductionTerminalBenchmark:' in line]
                  notice('Production target completions ' + group, '\n'.join(lines)[-3700:])
                  errors = [line[:350] for line in logcat if 'E ProductionTerminalBenchmark:' in line]
                  if errors:
                      notice('Production target failure ' + group, '\n'.join(errors)[:3700])
              instrument = (folder / 'instrumentation.log').read_text(errors='replace').splitlines()
              for i, line in enumerate(instrument):
                  if 'Error in production[' in line:
                      notice('Production driver failure ' + group, '\n'.join(instrument[max(0, i - 4):i + 16])[:3700])
          PY
      - name: Preserve compact original evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ inputs.run_id }}-${{ matrix.scenario }}-${{ github.run_id }}
          path: artifacts/compact-evidence/
          if-no-files-found: error
          retention-days: 30
