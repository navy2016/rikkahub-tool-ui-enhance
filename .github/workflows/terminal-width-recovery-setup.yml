name: P2 First Mount Configuration Preflight
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate setup-only contracts
        run: python3 -B -m unittest discover -s .github/scripts -p test_terminal_width_recovery_setup.py
      - name: Build pinned PRoot test asset
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Build unchanged Release-derived target and preparation driver
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-width-recovery-setup.py build
      - name: Preflight four first mounts without sampling performance
        run: python3 -B .github/scripts/terminal-width-recovery-setup.py run
      - name: Preserve original setup evidence without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-width-recovery-setup-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-width-recovery-setup/
            artifacts/terminal-pipeline/
            artifacts/terminal-validation/
          if-no-files-found: error
          retention-days: 30
