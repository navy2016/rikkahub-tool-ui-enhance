name: Full Virtual Content Identity Paired Experiment
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify fixed one-file candidate and performance protocol
        run: python3 -B -m unittest discover -s .github/scripts -p test_terminal_full_virtual_content_paired.py
      - name: Build pinned PRoot test asset for both targets
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Build two Release-derived uninstrumented targets and one common driver
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-full-virtual-content-paired.py build
      - name: Run four fixed same-boot AB-BA pairs using native PTY and real clock
        run: python3 -B .github/scripts/terminal-full-virtual-content-paired.py experiment
      - name: Preserve every original and missing-frame failure without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-content-paired-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-content-paired/
            artifacts/terminal-validation/
            artifacts/terminal-pipeline/manifest.json
            artifacts/terminal-pipeline/proot-overlay.json
          if-no-files-found: error
          retention-days: 30
