name: Verify Release APK

on:
  push:
    branches: [fix/terminal-viewport-semantic-reducer]
    paths: ['.github/workflows/verify-release-apk.yml']
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Successful Release Build run in this repository'
        required: true
      source_sha:
        description: 'Exact 40-character SHA built by that run'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Bind artifact to the successful release run and source SHA
        run: |
          set -euo pipefail
          # A workflow introduced only on a feature branch is not initially dispatchable.
          # Its path-filtered push verifies the latest existing release artifact on that branch.
          # No build, release publication or default-branch change is required.
          if [ -z "$RELEASE_RUN_ID" ] && [ -z "$SOURCE_SHA" ]; then
            while IFS=$'\t' read -r run_id source_sha; do
              artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq "[.artifacts[] | select(.name == \"rikkahub-release-$source_sha\" and .expired == false)] | length")
              if [ "$artifact_count" -eq 1 ]; then
                RELEASE_RUN_ID="$run_id"
                SOURCE_SHA="$source_sha"
                break
              fi
            done < <(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
              -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=10 \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv')
          fi
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          export RELEASE_RUN_ID SOURCE_SHA
          printf 'RELEASE_RUN_ID=%s\nSOURCE_SHA=%s\n' "$RELEASE_RUN_ID" "$SOURCE_SHA" >> "$GITHUB_ENV"
          mkdir -p verification
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > verification/source-run.json
          python3 - <<'PY'
          import json, os
          with open('verification/source-run.json') as stream:
              run = json.load(stream)
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Source SHA mismatch'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Release build did not succeed'
          assert run['path'] == '.github/workflows/release.yml', 'Not the production release workflow'
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Repository mismatch'
          PY
      - name: Download only the release APK artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RELEASE_RUN_ID }}
          name: rikkahub-release-${{ env.SOURCE_SHA }}
          path: apk
      - name: Verify signing, manifest, archive and native ABI
        run: |
          set -Eeuo pipefail
          trap 'code=$?; python3 - <<'"'"'PYERROR'"'"'
          from pathlib import Path
          texts = []
          for path in Path("verification").glob("*.txt"):
              texts.append(path.name + ":\n" + path.read_text(errors="replace")[-1800:])
          message = "\n\n".join(texts)[-3500:] or "No APK diagnostics produced; inspect artifact/tool discovery."
          print("::error title=APK verification failed::" + message.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))
          PYERROR
          exit "$code"' ERR
          mapfile -d '' apks < <(find apk -type f -name '*.apk' -print0)
          printf 'apk_count=%s\n' "${#apks[@]}" > verification/discovery.txt
          printf '%s\n' "${apks[@]}" >> verification/discovery.txt
          [ "${#apks[@]}" -eq 1 ]
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          printf 'tools=%s\n' "$tools" >> verification/discovery.txt
          "$tools/apksigner" verify --verbose --print-certs "${apks[0]}" > verification/signature.txt 2>&1
          "$tools/aapt" dump badging "${apks[0]}" > verification/manifest.txt 2>&1
          export APK_PATH="${apks[0]}"
          python3 - 2> verification/validation-errors.txt <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          apk = pathlib.Path(os.environ['APK_PATH'])
          manifest = pathlib.Path('verification/manifest.txt').read_text()
          signature = pathlib.Path('verification/signature.txt').read_text()
          package = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", manifest)
          assert package, 'Missing manifest package'
          assert package[1] == 'me.rerere.rikkahub.dev.next.mod', 'Unexpected app ID'
          assert 'application-debuggable' not in manifest, 'Debuggable APK'
          assert 'application-testOnly' not in manifest, 'Test-only APK'
          assert re.search(r'Verified using v[23](?:\.1)? scheme .*: true', signature), 'No v2/v3 signature'
          # Build Tools 37 labels this "V2 Signer:"; older versions use "Signer #1".
          # Match the certificate field, never the separate public-key digest.
          certificates = re.findall(r'^.*?\bcertificate SHA-256 digest: ([0-9a-fA-F]{64})\s*$', signature, re.MULTILINE)
          assert certificates, 'No signer certificate'
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None, 'Corrupt APK member'
              abis = sorted({name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')})
          assert abis == ['arm64-v8a'], f'Unexpected native ABIs: {abis}'
          digest = hashlib.sha256()
          with apk.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          result = dict(source_sha=os.environ['SOURCE_SHA'], release_run_id=os.environ['RELEASE_RUN_ID'],
              apk=apk.name, bytes=apk.stat().st_size, sha256=digest.hexdigest(), package=package[1],
              version_code=package[2], version_name=package[3], debuggable=False, native_abis=abis,
              signer_certificate_sha256=certificates, signature_verified=True, zip_verified=True)
          pathlib.Path('verification/apk-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          message = json.dumps(result)
          print('::notice title=Release APK verified::' + message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-verification-${{ env.SOURCE_SHA }}
          path: verification/
          if-no-files-found: error
          retention-days: 14
