name: Terminal Dual Frame Metrics Collector Audit
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate collector-only scope and exact ID classification
        run: python3 -B -m unittest discover -s .github/scripts -p test_terminal_frame_metrics_page_audit.py
      - name: Build pinned native test asset
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Build unchanged Release-derived page and dual observer driver
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-frame-metrics-page-audit.py build
      - name: Record fixed unmodified page draws with two independent queues
        run: python3 -B .github/scripts/terminal-frame-metrics-page-audit.py run
      - name: Preserve all original collector data without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-frame-metrics-page-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-frame-metrics-page-audit/
            artifacts/terminal-pipeline/
            artifacts/terminal-validation/
          if-no-files-found: error
          retention-days: 30
