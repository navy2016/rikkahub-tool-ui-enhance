name: Full Virtual P2 Width Recovery Baseline
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check unchanged production and fixed baseline contracts
        run: |
          python3 -B .github/scripts/terminal-width-recovery.py guard
          python3 -B -m unittest discover -s .github/scripts -p test_terminal_width_recovery.py
      - name: Build Release fixture without any generated-source overlay
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-width-recovery.py fixtures
      - name: Gate fixed width counters on existing non-root KVM harness
        run: python3 -B .github/scripts/terminal-width-recovery.py mechanism
      - name: Build pinned test-only PRoot
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Build one unchanged Release-derived page with resolved runtime graphs
        run: python3 -B .github/scripts/terminal-width-recovery.py build
      - name: Measure 20 fixed native recovery windows on a fresh guest
        run: python3 -B .github/scripts/terminal-width-recovery.py native
      - name: Preserve all original evidence without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-width-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-width-recovery/
            artifacts/terminal-pipeline/
            artifacts/terminal-validation/
            benchmarks/terminal-viewport-tests/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 30
