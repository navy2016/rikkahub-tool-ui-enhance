name: Terminal Scrollback Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Measured repetitions per size/scenario/renderer (1-50)'
        default: '3'
        required: true
      candidate:
        description: 'widthIntrinsics compares production, full-layout width and intrinsic width on one device'
        type: choice
        options: [widthIntrinsics, productionVsLazy, lazyHistory, chunkedEager, chunkedLayers]
        default: widthIntrinsics
      diagnose_job_id:
        description: 'Optional: read only the final 16 KiB of a failed benchmark job; skips building'
        required: false
        default: ''
        type: string
  # Archived renderer-only experiments stay manually runnable. Automatic regression now uses
  # terminal-production-benchmark.yml and the actual production viewport/controller.

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: ${{ inputs.diagnose_job_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read bounded log tail from the requested benchmark job
        uses: actions/github-script@v7
        env:
          JOB_ID: ${{ inputs.diagnose_job_id }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const id = process.env.JOB_ID;
            if (!/^\d+$/.test(id)) throw new Error('Expected a numeric job ID');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const {data: job} = await github.rest.actions.getJobForWorkflowRun({...repo, job_id: Number(id)});
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: job.run_id});
            if (run.path !== '.github/workflows/terminal-scrollback-benchmark.yml' || job.status !== 'completed') {
              throw new Error('Only completed benchmark jobs in this repository may be diagnosed');
            }
            const url = `${process.env.GITHUB_API_URL}/repos/${repo.owner}/${repo.repo}/actions/jobs/${id}/logs`;
            const redirect = await fetch(url, {
              headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
              redirect: 'manual', signal: AbortSignal.timeout(30000)
            });
            if (redirect.status !== 302) throw new Error(`Log redirect status ${redirect.status}`);
            const location = redirect.headers.get('location');
            // Azure Blob does not support HTTP suffix ranges (bytes=-N). Resolve the explicit
            // interval from HEAD, then enforce both status and length before reading any body.
            const head = await fetch(location, {method: 'HEAD',
              headers: {'Accept-Encoding': 'identity'}, signal: AbortSignal.timeout(30000)});
            const length = Number(head.headers.get('content-length'));
            if (!head.ok || !Number.isSafeInteger(length) || length <= 0) {
              throw new Error(`Cannot determine log length (${head.status})`);
            }
            const start = Math.max(0, length - 16384);
            const range = `bytes=${start}-${length - 1}`;
            const tail = await fetch(location, {
              headers: {Range: range, 'x-ms-range': range, 'x-ms-version': '2023-11-03',
                'Accept-Encoding': 'identity'}, signal: AbortSignal.timeout(30000)
            });
            const contentLength = Number(tail.headers.get('content-length'));
            if (tail.status !== 206 || !Number.isSafeInteger(contentLength) || contentLength > 16384) {
              await tail.body?.cancel();
              throw new Error(`Range unavailable (${tail.status}); refusing full log download`);
            }
            const buffer = await tail.arrayBuffer();
            if (buffer.byteLength > 16384) throw new Error('Log range exceeds requested bound');
            const text = new TextDecoder().decode(buffer).split('\n')
              .filter(line => !/sig=|jwt=|token=/i.test(line)).slice(-70).join('\n');
            core.info(`run=${run.id} sha=${run.head_sha} job=${id} range=${tail.headers.get('content-range')}`);
            core.info(text);
            core.notice(text.slice(-2800), {title: 'Benchmark bounded job tail'});
  benchmark:
    if: ${{ inputs.diagnose_job_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TERMINAL_BENCHMARK_ITERATIONS: ${{ inputs.iterations || '3' }}
      TERMINAL_BENCHMARK_CANDIDATE: ${{ inputs.candidate || 'widthIntrinsics' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test fixtures and build isolated benchmark APKs
        run: |
          chmod +x gradlew
          mkdir -p artifacts/terminal-scrollback
          set +e
          ./gradlew -PterminalBenchmarks=true \
            :benchmarks:terminal-target:testBenchmarkUnitTest \
            :benchmarks:terminal-target:assembleBenchmark \
            :benchmarks:terminal-macrobenchmark:assembleBenchmark --stacktrace \
            2>&1 | tee artifacts/terminal-scrollback/build.log
          result=${PIPESTATUS[0]}
          if [ "$result" != 0 ]; then
            python3 - <<'PYERROR'
          from pathlib import Path
          text = Path("artifacts/terminal-scrollback/build.log").read_text()
          errors = "\n".join(line for line in text.splitlines() if line.startswith("e:"))
          reason = text.split("* What went wrong:")[-1].split("* Try:")[0]
          message = (errors + "\n" + reason)[:6000]
          print("::error title=Benchmark build failed::" + message.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))
          PYERROR
            exit "$result"
          fi
      - name: Require benchmark fixture and width-index unit tests
        if: always()
        run: |
          python3 .github/scripts/report-terminal-tests.py benchmarks/terminal-target/build/test-results \
            --require-suite me.rerere.rikkahub.benchmark.TerminalBenchmarkWorkloadTest \
            --require-suite me.rerere.rikkahub.benchmark.TerminalBenchmarkLayoutTest \
            --require-suite me.rerere.rikkahub.benchmark.TerminalBenchmarkWidthIndexTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare selected renderers at 1k / 5k / 10k on one emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: Nexus 6
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash benchmarks/run-ci.sh
      - name: Summarize and validate measurements
        if: always()
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*.py'
          suite=ab
          if [ "$TERMINAL_BENCHMARK_CANDIDATE" = chunkedEager ]; then suite=chunked-eager; fi
          if [ "$TERMINAL_BENCHMARK_CANDIDATE" = chunkedLayers ]; then suite=chunked-layers; fi
          if [ "$TERMINAL_BENCHMARK_CANDIDATE" = productionVsLazy ]; then suite=production-lazy; fi
          if [ "$TERMINAL_BENCHMARK_CANDIDATE" = widthIntrinsics ]; then suite=width-intrinsics; fi
          python3 benchmarks/summarize.py benchmarks/terminal-macrobenchmark/build/outputs \
            --sha "$GITHUB_SHA" --environment ci-emulator --suite "$suite" --require-complete --require-width-index --github-annotation \
            --output artifacts/terminal-scrollback/summary.md
          cat artifacts/terminal-scrollback/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw data, traces, logs and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-scrollback-benchmark-${{ env.TERMINAL_BENCHMARK_CANDIDATE }}-${{ github.sha }}
          path: |
            artifacts/terminal-scrollback/**
            benchmarks/terminal-target/build/outputs/apk/benchmark/**
            benchmarks/terminal-target/build/test-results/**
            benchmarks/terminal-macrobenchmark/build/outputs/**
            benchmarks/terminal-macrobenchmark/build/reports/**
          retention-days: 14
