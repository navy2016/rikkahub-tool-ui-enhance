name: In-frame Candidate Original Native Page Regression
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify unchanged original page assertions and frozen candidate
        run: |
          python3 -B -m unittest discover -s .github/scripts -p test_terminal_inframe_page_regression.py
          python3 -B .github/scripts/terminal-inframe-page-regression.py guard
      - name: Build pinned shared native test asset
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Build uninstrumented Release-derived frozen candidate
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-inframe-page-regression.py build
      - name: Run original ordinary and TUI IME selection mouse reentry regressions
        run: python3 -B .github/scripts/terminal-inframe-page-regression.py run
      - name: Preserve complete regression originals without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-inframe-page-regression-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-inframe-page-regression/
            artifacts/terminal-pipeline/
            artifacts/terminal-validation/
          if-no-files-found: error
          retention-days: 30
