name: Full Virtual P2 Width Checkpoint Paired Benchmark
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate unchanged candidate and fixed pairing protocol
        run: python3 -B -m unittest discover -s .github/scripts -p test_terminal_width_recovery_paired.py
      - name: Build pinned PRoot test asset
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Build two Release-derived targets and one shared driver
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-width-recovery-paired.py build
      - name: Measure fixed real-IME MAIN-return and refresh pairs
        run: python3 -B .github/scripts/terminal-width-recovery-paired.py experiment
      - name: Preserve originals failures and exact source proof without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-width-recovery-paired-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-width-recovery-paired/
            artifacts/terminal-pipeline/manifest.json
            artifacts/terminal-pipeline/proot-overlay.json
            artifacts/terminal-validation/
          if-no-files-found: error
          retention-days: 30
