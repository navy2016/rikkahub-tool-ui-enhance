name: Terminal Viewport Interaction Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'all, fresh default, publication regressions, or lint/Release type checking without tests'
        type: choice
        options: [all, defaultBottom, renderSnapshot, textMetrics, chunkViews, stableMount, tuiDisplay, bottomVisibility, bottomControl, tuiHistory, longHistoryDiagnostic, longHistoryProbe, longHistoryPerformance, staticChecks]
        default: all
      production_sha:
        description: 'Optional exact archived production SHA for defaultBottom only; tests remain from this ref'
        type: string
        default: ''
  push:
    branches: [fix/terminal-viewport-semantic-reducer, opt/terminal-verified-a79e7b6]
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/utils/TerminalEmulator.kt'
      - 'app/src/main/java/me/rerere/rikkahub/utils/TerminalFrameSnapshot.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalViewport*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalRenderedRows.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalLazyItem*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/ProcessSessionPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalVirtual*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalTranscriptWidth.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalRowWidthMeasurer.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalTranscriptViewport.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalRenderControls.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalRenderSnapshot.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalEagerViewportGeometry.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalEagerGeometryCache.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalTranscriptWidthIndex.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalItemViewport.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalFastFlingTracker.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalRender*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalViewport*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalLazyViewport*.kt'
      - 'app/src/test/java/me/rerere/rikkahub/data/container/TerminalLazyViewportMeasurementTest.kt'
      - 'benchmarks/terminal-viewport-tests/**'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalBenchmarkViewport.kt'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalBenchmarkLayout.kt'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalBenchmarkWidthIndex.kt'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalIntrinsicWidthMeasurer.kt'
      - '.github/workflows/terminal-viewport-interactions.yml'
      - '.github/scripts/*terminal*'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read

jobs:
  long-history:
    if: ${{ inputs.suite == 'longHistoryDiagnostic' || inputs.suite == 'longHistoryProbe' || inputs.suite == 'longHistoryPerformance' }}
    uses: ./.github/workflows/terminal-long-history.yml
    with:
      probe: ${{ inputs.suite == 'longHistoryProbe' }}
      performance: ${{ inputs.suite == 'longHistoryPerformance' }}
  gestures:
    if: ${{ inputs.suite != 'longHistoryDiagnostic' && inputs.suite != 'longHistoryProbe' && inputs.suite != 'longHistoryPerformance' }}
    name: viewport (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.suite == 'defaultBottom' && '["defaultBottom"]' || inputs.suite == 'renderSnapshot' && '["renderSnapshot"]' || inputs.suite == 'textMetrics' && '["textMetrics"]' || inputs.suite == 'chunkViews' && '["chunksRender","chunksViewport"]' || inputs.suite == 'stableMount' && '["bundle"]' || inputs.suite == 'tuiDisplay' && '["tuiDisplay"]' || inputs.suite == 'bottomVisibility' && '["bottomVisibility"]' || inputs.suite == 'bottomControl' && '["bottomControl"]' || inputs.suite == 'tuiHistory' && '["tuiHistory"]' || inputs.suite == 'staticChecks' && '["staticChecks"]' || '["geometry","interaction","bundle","tuiDisplay","bottomVisibility","tuiHistory"]') }}
    env:
      TERMINAL_VIEWPORT_SUITE: ${{ inputs.suite || 'all' }}
      TERMINAL_VIEWPORT_GROUP: ${{ matrix.group }}
      TERMINAL_BOTTOM_CONTROL: ${{ matrix.group == 'bottomControl' }}
      TERMINAL_OLD_DEFAULT: ${{ inputs.production_sha != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind negative control to exact prior production without modifying the test oracle
        if: ${{ matrix.group == 'bottomControl' }}
        run: |
          set -euo pipefail
          baseline=8ed4f06e10039233511c4ef43bb39ed717ef6ef6
          [ "$(git rev-parse "$baseline:app/src/main")" = 639ee4f3286cb647a0b09cfa61a3dc1659586e1d ]
          git archive "$baseline" app/src/main | tar -x
          python3 -B .github/scripts/terminal-negative-control-sources.py
          echo "::notice title=Bottom visibility negative-control source::tests=$GITHUB_SHA production=$baseline; clipped rectangles are EXPECTED here only"
      - name: Bind optional old production source to current fresh-default regression tests
        if: ${{ inputs.production_sha != '' }}
        env:
          PRODUCTION_SHA: ${{ inputs.production_sha }}
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [ "$TERMINAL_VIEWPORT_SUITE" = defaultBottom ]
          git fetch --no-tags --depth=1 origin "$PRODUCTION_SHA"
          [ "$(git rev-parse FETCH_HEAD)" = "$PRODUCTION_SHA" ]
          # Replace only production files in the disposable runner checkout; keep this ref's tests.
          git archive FETCH_HEAD app/src/main | tar -x
          python3 -B .github/scripts/terminal-negative-control-sources.py
          echo "::notice title=Fresh default regression source::tests=$GITHUB_SHA production=$PRODUCTION_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test JUnit validation reporting
        if: ${{ matrix.group != 'staticChecks' }}
        run: |
          if [ "$TERMINAL_VIEWPORT_SUITE" = bottomControl ] || [ "$TERMINAL_OLD_DEFAULT" = true ]; then
            cd .github/scripts
            python3 -B -m unittest test_terminal_bottom_visibility.BottomVisibilityReportTest
          elif [ "$TERMINAL_VIEWPORT_SUITE" = renderSnapshot ]; then
            cd .github/scripts
            python3 -m unittest test_terminal_viewport_shards test_terminal_render_snapshot test_terminal_panel_subscription
          elif [ "$TERMINAL_VIEWPORT_SUITE" = textMetrics ]; then
            cd .github/scripts
            python3 -m unittest test_terminal_viewport_shards test_terminal_text_metrics test_terminal_row_width test_terminal_panel_subscription
          elif [ "$TERMINAL_VIEWPORT_SUITE" = chunkViews ]; then
            cd .github/scripts
            python3 -m unittest test_terminal_viewport_shards test_terminal_chunk_views
          elif [ "$TERMINAL_VIEWPORT_SUITE" = stableMount ]; then
            cd .github/scripts
            python3 -m unittest test_terminal_viewport_shards test_terminal_bundle_reports test_terminal_pipeline
          else
            python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          fi
      - name: Lint only the Release terminal fixture before compiling the test pair
        if: ${{ matrix.group == 'staticChecks' }}
        run: |
          chmod +x gradlew
          bash .github/scripts/run-terminal-gradle.sh -PterminalViewportTests=true \
            :benchmarks:terminal-viewport-tests:lintRelease --stacktrace
      - name: Publish bounded lint errors without downloading the full build log
        if: ${{ failure() && matrix.group == 'staticChecks' }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for report in Path('benchmarks/terminal-viewport-tests/build/reports').glob('lint-results-*.xml'):
              count = 0
              for issue in ET.parse(report).getroot().iter('issue'):
                  if issue.get('severity') not in ('Error', 'Fatal'):
                      continue
                  if count >= 8:
                      break
                  location = issue.find('location')
                  where = '' if location is None else str(location.attrib)
                  text = (issue.get('id', '') + ': ' + issue.get('message', '') + '\n' + where)[:2400]
                  print('::error title=Terminal fixture lint::' + text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
                  count += 1
          PY
      - name: Build isolated gesture fixture and instrumented tests
        run: |
          chmod +x gradlew
          bash .github/scripts/run-terminal-gradle.sh -PterminalViewportTests=true \
            :benchmarks:terminal-viewport-tests:assembleRelease \
            :benchmarks:terminal-viewport-tests:assembleReleaseAndroidTest --stacktrace
      - name: Enable KVM
        if: ${{ matrix.group != 'staticChecks' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test pointer gestures and natural transcript geometry
        if: ${{ matrix.group != 'staticChecks' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: Nexus 6
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Keep an instrumentation/ADB deadlock from consuming the whole job without
          # reaching the JUnit and logcat reporting steps below.
          script: python3 .github/scripts/run-terminal-with-timeout.py 900 bash benchmarks/terminal-viewport-tests/run-ci.sh
      - name: Require every case assigned to this shard
        if: ${{ always() && matrix.group != 'staticChecks' }}
        run: |
          if [ "$TERMINAL_VIEWPORT_GROUP" = bottomControl ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalBottomVisibilityInstrumentedTest \
              --require-case-group 'bottomVisibility:2'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_GROUP" = bottomVisibility ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalBottomVisibilityInstrumentedTest \
              --require-case-group 'bottomVisibility:6'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_SUITE" = chunkViews ]; then
            if [ "$TERMINAL_VIEWPORT_GROUP" = chunksRender ]; then
              python3 .github/scripts/report-terminal-tests.py \
                benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalChunkViewsInstrumentedTest \
                --require-case-group 'chunkViews:7' \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalTranscriptGeometryInstrumentedTest \
                --require-case-group 'chunkLayers=false:4' \
                --require-case-group 'chunkLayers=true:4' \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalTextCompatibilityInstrumentedTest \
                --require-case-group 'terminalText:3' \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalRowMeasurementInstrumentedTest \
                --require-case-group 'measurementNode:8'
            else
              [ "$TERMINAL_VIEWPORT_GROUP" = chunksViewport ]
              python3 .github/scripts/report-terminal-tests.py \
                benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalDefaultBottomInstrumentedTest \
                --require-case-group 'defaultBottom:7' \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalImeVirtualHistoryInstrumentedTest \
                --require-case-group 'imeStable:6' \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalViewportStabilityInstrumentedTest \
                --require-case-group 'stabilityDefaultTenThousandFifoUpdatesReadOnlyBoundaryHeightsAndKeepLockedAnchor:1' \
                --require-case-group 'stabilityDetachAndRecreateRestoresMeasuredAnchorAfterBackgroundTrim:1' \
                --require-case-group 'stabilityTenThousandRowFallbackSharesHistoryAndReleasesPrefixOnReturn:1' \
                --require-case-group 'stabilityOutputDuringRepeatedModeAndImeFallbackChangesSettlesAtLatestTail:1' \
                --require-suite me.rerere.rikkahub.viewporttest.TerminalItemViewportInstrumentedTest \
                --require-case-group 'itemNativeEagerFallbackDoesNotRecomposeArchivedHistoryOnActiveUpdates:1'
            fi
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_SUITE" = textMetrics ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalTextMetricsInstrumentedTest \
              --require-case-group 'textMetrics:6' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalBindingProjectionInstrumentedTest \
              --require-case-group 'bindingProjection:3' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalIntrinsicWidthInstrumentedTest \
              --require-case-group 'intrinsicWidth:10' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalRowMeasurementInstrumentedTest \
              --require-case-group 'measurementNode:8' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalDefaultBottomInstrumentedTest \
              --require-case-group 'defaultBottom:7' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalImeVirtualHistoryInstrumentedTest \
              --require-case-group 'imeStable:6'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_SUITE" = renderSnapshot ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalRenderSnapshotInstrumentedTest \
              --require-case-group 'renderSnapshot:6' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalBindingProjectionInstrumentedTest \
              --require-case-group 'bindingProjection:3' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalDefaultBottomInstrumentedTest \
              --require-case-group 'defaultBottom:7' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalImeVirtualHistoryInstrumentedTest \
              --require-case-group 'imeStable:6' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalViewportStabilityInstrumentedTest \
              --require-case-group 'stability:9'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_SUITE" = defaultBottom ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalDefaultBottomInstrumentedTest \
              --require-case-group 'defaultBottom:7'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_GROUP" = interaction ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalItemViewportInstrumentedTest \
              --require-case-group 'itemNative:20' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalImeVirtualHistoryInstrumentedTest \
              --require-case-group 'imeStable:6' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalDefaultBottomInstrumentedTest \
              --require-case-group 'defaultBottom:7' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalViewportStabilityInstrumentedTest \
              --require-case-group 'stability:9' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalScrollCompletionInstrumentedTest \
              --require-case-group 'scrollCompletion:7' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalPanelSubscriptionInstrumentedTest \
              --require-case-group 'panelSubscription:3' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalBindingProjectionInstrumentedTest \
              --require-case-group 'bindingProjection:3' \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalRenderSnapshotInstrumentedTest \
              --require-case-group 'renderSnapshot:6'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_GROUP" = bundle ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalBundleInstrumentedTest \
              --require-case-group 'bundle:7'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_GROUP" = tuiDisplay ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalTuiDisplayInstrumentedTest \
              --require-case-group 'tuiDisplay:4'
            exit $?
          fi
          if [ "$TERMINAL_VIEWPORT_GROUP" = tuiHistory ]; then
            python3 .github/scripts/report-terminal-tests.py \
              benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
              --require-suite me.rerere.rikkahub.viewporttest.TerminalTuiHistoryInstrumentedTest \
              --require-case-group 'tuiHistory:5'
            exit $?
          fi
          [ "$TERMINAL_VIEWPORT_GROUP" = geometry ]
          python3 .github/scripts/report-terminal-tests.py \
            benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalChunkViewsInstrumentedTest \
            --require-case-group 'chunkViews:7' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalTextMetricsInstrumentedTest \
            --require-case-group 'textMetrics:6' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalViewportGestureInstrumentedTest \
            --require-case-group 'lazyHistory=false:12' \
            --require-case-group 'lazyHistory=true:12' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalTranscriptGeometryInstrumentedTest \
            --require-case-group 'chunkLayers=false:4' \
            --require-case-group 'chunkLayers=true:4' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalLazyNaturalGeometryInstrumentedTest \
            --require-case-group 'widthIntrinsics=false:11' \
            --require-case-group 'widthIntrinsics=true:11' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalIntrinsicWidthInstrumentedTest \
            --require-case-group 'intrinsicWidth:10' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalRenderModeInstrumentedTest \
            --require-case-group 'rendererSwitchKeepsNaturalGeometrySelectionAndBothScrollOffsets:1' \
            --require-case-group 'renderButtonCancelApplyResetAndLongPressAreExplicit:1' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalRowMeasurementInstrumentedTest \
            --require-case-group 'measurementNode:8' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalTextCompatibilityInstrumentedTest \
            --require-case-group 'terminalText:3'
      - name: Require complete frozen-control paired scroll evidence
        if: ${{ always() && matrix.group == 'interaction' }}
        run: python3 .github/scripts/report-terminal-scroll-completion.py
      - name: Require paired panel subscription work and lifecycle correctness
        if: ${{ always() && matrix.group == 'interaction' }}
        run: python3 .github/scripts/report-terminal-panel-subscription.py
      - name: Require live layout projection work and exact bottom visibility
        if: ${{ always() && (matrix.group == 'interaction' || matrix.group == 'renderSnapshot' || matrix.group == 'textMetrics') }}
        run: python3 .github/scripts/report-terminal-panel-subscription.py --binding
      - name: Require all publication tests and exact no-output reuse evidence
        if: ${{ always() && (matrix.group == 'interaction' || matrix.group == 'renderSnapshot') }}
        run: python3 .github/scripts/report-terminal-render-snapshot.py
      - name: Require exact row widths and alternating uncached-pass evidence
        if: ${{ always() && (matrix.group == 'geometry' || matrix.group == 'textMetrics') }}
        run: python3 .github/scripts/report-terminal-row-width.py
      - name: Require exact text-metric work and asynchronous font compatibility
        if: ${{ always() && (matrix.group == 'geometry' || matrix.group == 'textMetrics') }}
        run: python3 .github/scripts/report-terminal-text-metrics.py
      - name: Require exact chunk-view construction counts and lifecycle correctness
        if: ${{ always() && (matrix.group == 'geometry' || matrix.group == 'chunksRender') }}
        run: python3 .github/scripts/report-terminal-chunk-views.py
      - name: Require all TUI cursor pointer and regular-history evidence
        if: ${{ always() && matrix.group == 'tuiDisplay' }}
        run: python3 -B .github/scripts/terminal-tui-bundle-reports.py display
      - name: Require actual blank-cursor and TUI rectangle evidence
        if: ${{ always() && (matrix.group == 'bottomVisibility' || matrix.group == 'bottomControl') }}
        run: |
          if [ "$TERMINAL_BOTTOM_CONTROL" = true ]; then
            python3 -B .github/scripts/terminal-bottom-visibility-reports.py --control
          else
            python3 -B .github/scripts/terminal-bottom-visibility-reports.py
          fi
      - name: Require TUI grouping streams rectangles and fallback receipts
        if: ${{ always() && matrix.group == 'tuiHistory' }}
        run: python3 -B .github/scripts/terminal-tui-history-reports.py viewport
      - name: Upload fixture APKs, JUnit and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-viewport-interactions-${{ github.sha }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            benchmarks/terminal-viewport-tests/build/outputs/**
            benchmarks/terminal-viewport-tests/build/reports/**
            artifacts/terminal-validation/**
            artifacts/terminal-tui/**
          retention-days: 14
