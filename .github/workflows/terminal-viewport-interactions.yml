name: Terminal Viewport Interaction Tests

on:
  workflow_dispatch:
  push:
    branches: [fix/terminal-viewport-semantic-reducer]
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/utils/TerminalEmulator.kt'
      - 'app/src/main/java/me/rerere/rikkahub/utils/TerminalFrameSnapshot.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalViewport*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalRenderedRows.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalLazyItem*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/ProcessSessionPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalVirtual*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalTranscriptWidth.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalTranscriptViewport.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalRenderControls.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalEagerViewportGeometry.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalEagerGeometryCache.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalTranscriptWidthIndex.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalItemViewport.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalFastFlingTracker.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalRender*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalViewport*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalLazyViewport*.kt'
      - 'app/src/test/java/me/rerere/rikkahub/data/container/TerminalLazyViewportMeasurementTest.kt'
      - 'benchmarks/terminal-viewport-tests/**'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalBenchmarkViewport.kt'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalBenchmarkLayout.kt'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalBenchmarkWidthIndex.kt'
      - 'benchmarks/terminal-target/src/main/java/me/rerere/rikkahub/benchmark/TerminalIntrinsicWidthMeasurer.kt'
      - '.github/workflows/terminal-viewport-interactions.yml'
      - '.github/scripts/*terminal*'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read

jobs:
  gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test JUnit validation reporting
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build isolated gesture fixture and instrumented tests
        run: |
          chmod +x gradlew
          bash .github/scripts/run-terminal-gradle.sh -PterminalViewportTests=true \
            :benchmarks:terminal-viewport-tests:assembleRelease \
            :benchmarks:terminal-viewport-tests:assembleReleaseAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test pointer gestures and natural transcript geometry
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: Nexus 6
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Keep an instrumentation/ADB deadlock from consuming the whole job without
          # reaching the JUnit and logcat reporting steps below.
          script: python3 .github/scripts/run-terminal-with-timeout.py 900 bash benchmarks/terminal-viewport-tests/run-ci.sh
      - name: Require both gesture arms and both chunk geometry modes
        if: always()
        run: |
          python3 .github/scripts/report-terminal-tests.py \
            benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalViewportGestureInstrumentedTest \
            --require-case-group 'lazyHistory=false:12' \
            --require-case-group 'lazyHistory=true:12' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalTranscriptGeometryInstrumentedTest \
            --require-case-group 'chunkLayers=false:4' \
            --require-case-group 'chunkLayers=true:4' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalLazyNaturalGeometryInstrumentedTest \
            --require-case-group 'widthIntrinsics=false:11' \
            --require-case-group 'widthIntrinsics=true:11' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalIntrinsicWidthInstrumentedTest \
            --require-case-group 'intrinsicWidth:6' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalRenderModeInstrumentedTest \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalRowMeasurementInstrumentedTest \
            --require-case-group 'measurementNode:7' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalTextCompatibilityInstrumentedTest \
            --require-case-group 'terminalText:3' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalItemViewportInstrumentedTest \
            --require-case-group 'itemNative:20' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalImeVirtualHistoryInstrumentedTest \
            --require-case-group 'imeStable:6' \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalViewportStabilityInstrumentedTest \
            --require-case-group 'stability:8'
      - name: Upload fixture APKs, JUnit and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-viewport-interactions-${{ github.sha }}
          path: |
            benchmarks/terminal-viewport-tests/build/outputs/**
            benchmarks/terminal-viewport-tests/build/reports/**
            artifacts/terminal-validation/**
          retention-days: 14
