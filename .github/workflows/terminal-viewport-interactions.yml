name: Terminal Viewport Interaction Tests

on:
  workflow_dispatch:
  push:
    branches: [fix/terminal-viewport-semantic-reducer]
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalViewport*.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/container/TerminalRenderedRows.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalFastFlingTracker.kt'
      - 'app/src/main/java/me/rerere/rikkahub/data/container/TerminalViewport*.kt'
      - 'benchmarks/terminal-viewport-tests/**'
      - '.github/workflows/terminal-viewport-interactions.yml'
      - '.github/scripts/*terminal*'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read

jobs:
  gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test JUnit validation reporting
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build isolated gesture fixture and instrumented tests
        run: |
          chmod +x gradlew
          bash .github/scripts/run-terminal-gradle.sh -PterminalViewportTests=true \
            :benchmarks:terminal-viewport-tests:assembleDebug \
            :benchmarks:terminal-viewport-tests:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inject real pointer gestures into eager and lazy containers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: Nexus 6
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash benchmarks/terminal-viewport-tests/run-ci.sh
      - name: Require eager and lazy gesture regression results
        if: always()
        run: |
          python3 .github/scripts/report-terminal-tests.py \
            benchmarks/terminal-viewport-tests/build/outputs/androidTest-results \
            --require-suite me.rerere.rikkahub.viewporttest.TerminalViewportGestureInstrumentedTest \
            --require-case-group 'lazyHistory=false:11' \
            --require-case-group 'lazyHistory=true:11'
      - name: Upload fixture APKs, JUnit and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-viewport-interactions-${{ github.sha }}
          path: |
            benchmarks/terminal-viewport-tests/build/outputs/**
            benchmarks/terminal-viewport-tests/build/reports/**
            artifacts/terminal-validation/**
          retention-days: 14
