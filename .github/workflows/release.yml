name: Release Build

on:
  push:
    branches: [ feat_epub, master, main, 'feature/interactive-session' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        required: true
        type: choice
        default: release
        options: [release, debug]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Restore bundled Bun asset from artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLED_RUNTIME_ARTIFACT_ID: 7524840443
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/.bundled-runtime"
          mkdir -p app/src/main/assets/bun "$STAGE"
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o "$STAGE/bundled-runtime.zip" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${BUNDLED_RUNTIME_ARTIFACT_ID}/zip"
          unzip -o "$STAGE/bundled-runtime.zip" -d "$STAGE/extracted"
          BUN_ASSET="$STAGE/extracted/bun/bun-alpine-aarch64-musl.tar.gz"
          test -f "$BUN_ASSET"
          ! grep -q 'version https://git-lfs.github.com/spec/v1' "$BUN_ASSET"
          cp "$BUN_ASSET" app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz
          ls -lh app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = debug ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-${{ github.event.inputs.build_type || 'release' }}-${{ github.sha }}
          path: app/build/outputs/apk/${{ github.event.inputs.build_type || 'release' }}/*.apk
          if-no-files-found: error
          retention-days: 14
