name: Release Build

on:
  push:
    branches: [ feat_epub, master, main, 'feature/interactive-session', 'fix/container-terminal-lifecycle', 'fix/terminal-experience-regressions', 'fix/terminal-session-state-and-viewport' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        required: true
        type: choice
        default: release
        options: [release, debug]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = debug ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-${{ github.event.inputs.build_type || 'release' }}-${{ github.sha }}
          path: app/build/outputs/apk/${{ github.event.inputs.build_type || 'release' }}/*.apk
          if-no-files-found: error
          retention-days: 14
