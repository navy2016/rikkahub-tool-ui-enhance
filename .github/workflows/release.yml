name: Release Build

on:
  push:
    branches: [ feat_epub, master, main, 'feature/interactive-session' ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Restore bundled bun/omp assets from artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLED_RUNTIME_ARTIFACT_ID: 7524840443
        run: |
          set -eux
          mkdir -p app/src/main/assets/bun app/src/main/assets/omp /tmp/rikkahub-bundled-runtime
          curl -L             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -o /tmp/rikkahub-bundled-runtime/bundled-runtime.zip             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${BUNDLED_RUNTIME_ARTIFACT_ID}/zip"
          unzip -o /tmp/rikkahub-bundled-runtime/bundled-runtime.zip -d /tmp/rikkahub-bundled-runtime/extracted
          find /tmp/rikkahub-bundled-runtime/extracted -type f -maxdepth 6 -print
          cp /tmp/rikkahub-bundled-runtime/extracted/bun/bun-alpine-aarch64-musl.tar.gz app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz
          cp /tmp/rikkahub-bundled-runtime/extracted/omp/omp-alpine-aarch64-musl.tar.gz app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz
          test ! -f app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz || ! grep -q 'version https://git-lfs.github.com/spec/v1' app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz
          test ! -f app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz || ! grep -q 'version https://git-lfs.github.com/spec/v1' app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz
          ls -lh app/src/main/assets/bun/bun-alpine-aarch64-musl.tar.gz app/src/main/assets/omp/omp-alpine-aarch64-musl.tar.gz

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          
          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          
          # 写入Google Services配置
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/release/*.apk
