name: BOOTTIME Frame Identity Qualification
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify frozen protocol and exact-identity state machine
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_terminal_frame_identity*.py'
          python3 -B .github/scripts/terminal-frame-identity-qualification.py guard
      - name: Build pinned native test asset
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Build unchanged Release-derived target and BOOTTIME collector
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-frame-identity-qualification.py build
      - name: Qualify fixed32windows without an optimization candidate
        run: python3 -B .github/scripts/terminal-frame-identity-qualification.py run
      - name: Preserve original attempts submissions missing states and traces without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-frame-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-frame-identity-qualification/
            artifacts/terminal-pipeline/
            artifacts/terminal-validation/
          if-no-files-found: error
          retention-days: 30
