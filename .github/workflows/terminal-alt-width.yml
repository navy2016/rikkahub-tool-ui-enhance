name: Full Virtual Alternate Width Paired Experiment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate fixed source patch and protocol without compiling locally
        run: python3 -B -m unittest discover -s .github/scripts -p test_terminal_alt_width.py
      - name: Build pinned test-only PRoot once for both targets
        run: python3 -B .github/scripts/build-terminal-proot.py
      - name: Candidate JVM contracts and two Release-derived targets with common driver
        run: |
          chmod +x gradlew
          python3 -B .github/scripts/terminal-alt-width.py build
      - name: Real-font oracle then fixed four AB-BA pairs on one guest
        run: python3 -B .github/scripts/terminal-alt-width.py experiment
      - name: Preserve originals and failures without APK delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-alt-width-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/terminal-alt-width/
            artifacts/terminal-validation/
            artifacts/terminal-pipeline/manifest.json
            artifacts/terminal-pipeline/proot-overlay.json
          if-no-files-found: error
          retention-days: 30
